apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts   
      chart: loki
      targetRevision: 18.12.1
      helm:
        skipCrds: true
        valueFiles:
          - $values/loki-values.yaml

    - repoURL: https://github.com/cajolmgr/budgetmate
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: loki

  syncPolicy:
    syncOptions:
      - CreateNamespace=true