grafana:
  admin:
    existingSecret: "monitoring-grafana"
    userKey: admin-user
    passwordKey: admin-password
    
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  grafana.ini:
    plugins:
      preinstall_disabled: true