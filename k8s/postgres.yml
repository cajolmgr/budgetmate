apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: budgetmate

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: budgetmate
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: kajol
          ports:
            - containerPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: budgetmate
spec:
  selector:
    app: postgres
  ports: 
    - port: 5432
      targetPort: 5432
  type: ClusterIP

  