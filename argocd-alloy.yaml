apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        skipCrds: true
        valueFiles:
          - $values/alloy-values.yaml

    - repoURL: https://github.com/cajolmgr/budgetmate
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: alloy

  syncPolicy:
    syncOptions:
      - CreateNamespace=true