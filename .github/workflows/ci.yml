name: budgetmate CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install ruff==0.16.5

      - name: Lint Backend
        run: |
          python -m ruff check backend/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:${{ github.sha }}

      - name: Create CI environment
        run: |
          cat > .env <<EOF
          POSTGRES_DB=budgetmate
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          EOF

      - name: Start containers
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d

      - name: Wait for backend
        run: |
          echo "Waiting for FastAPI..."

          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/docs > /dev/null 2>&1; then
              echo "FastAPI is ready!"
              exit 0
            fi

            echo "FastAPI not ready yet..."
            sleep 2
          done

          echo "FastAPI failed to start."
          docker compose logs
          exit 1
      
      - name: Run API Tests
        run: |
          python -m pip install pytest requests
          python -m pytest backend/tests/

      - name: Stop containers
        if: always()
        run: docker compose down