
name: budgetmate CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: budgetmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kajol
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:${{ github.sha }}

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec budgetmate-postgres pg_isready -U postgres -d budgetmate; then
              echo "PostgreSQL is ready"
              break
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Start Backend
        run: docker compose up -d backend

      - name: Wait for Backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/docs; then
              echo "Backend is ready"
              break
            fi

            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run API Tests
        run: | 
          python -m pip install pytest requests
          python -m pytest backend/tests/

      - name: Stop containers
        if: always()
        run: docker compose down

