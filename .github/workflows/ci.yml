name: budgetmate CI

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

jobs:
    build:
        name: Build Docker Images
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME}}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build backend image
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: | 
                  ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:latest
                  ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-backend:${{ github.sha }}

            - name: Build frontend image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: | 
                  ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:latest
                  ${{ secrets.DOCKERHUB_USERNAME }}/budgetmate-frontend:${{ github.sha }}

