# BudgetMate Helm configuration

# Namespace
namespace: budgetmate
# Backend
backend:
  replicaCount: 1
  image:
    repository: kajol1288/budgetmate-backend
    tag: 929d2a1c34eb1eb0f17bf7ba6a06d6235aabce9f
    pullPolicy: IfNotPresent
  service:
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
# Frontend
frontend:
  replicaCount: 1
  image:
    repository: kajol1288/budgetmate-frontend
    tag: 929d2a1c34eb1eb0f17bf7ba6a06d6235aabce9f
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
# PostgreSQL
postgres:
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  database: budgetmate
  username: postgres
  service:
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
